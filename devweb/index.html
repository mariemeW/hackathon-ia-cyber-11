<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechCorp AI Chat — Phi-3.5 Financial</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .logo-text h1 {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .logo-text p {
      font-size: 12px;
      color: #94a3b8;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #94a3b8;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      transition: background 0.3s;
    }

    .status-dot.connected { background: #22c55e; }
    .status-dot.connecting {
      background: #f59e0b;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #status-text { transition: color 0.3s; }
    .status.connected #status-text { color: #22c55e; }
    .status.connecting #status-text { color: #f59e0b; }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-container::-webkit-scrollbar { width: 6px; }
    .chat-container::-webkit-scrollbar-track { background: transparent; }
    .chat-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    .message {
      display: flex;
      gap: 12px;
      max-width: 800px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.assistant { align-self: flex-start; }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .message.user .avatar { background: #3b82f6; }
    .message.assistant .avatar { background: #7c3aed; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      max-width: calc(100% - 48px);
      line-height: 1.6;
      font-size: 14px;
    }

    .message.user .bubble {
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .bubble {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    .message.assistant .bubble pre {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 13px;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 4px 0;
    }

    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: #64748b;
      border-radius: 50%;
      animation: typing 1.2s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    .welcome {
      text-align: center;
      padding: 60px 20px;
      color: #475569;
    }

    .welcome h2 { font-size: 22px; margin-bottom: 8px; color: #64748b; }
    .welcome p { font-size: 14px; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }

    .suggestion-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .suggestion-btn:hover {
      border-color: #3b82f6;
      color: #3b82f6;
      background: #172554;
    }

    footer {
      padding: 16px 24px;
      background: #1e293b;
      border-top: 1px solid #334155;
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 800px;
      margin: 0 auto;
    }

    textarea {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 12px 16px;
      border-radius: 12px;
      resize: none;
      font-size: 14px;
      font-family: inherit;
      line-height: 1.5;
      min-height: 48px;
      max-height: 160px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: #3b82f6; }
    textarea::placeholder { color: #475569; }

    #send-btn {
      background: #2563eb;
      border: none;
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    #send-btn:hover:not(:disabled) { background: #1d4ed8; }
    #send-btn:disabled { background: #1e293b; color: #475569; cursor: not-allowed; }

    .model-info {
      text-align: center;
      font-size: 11px;
      color: #334155;
      margin-top: 8px;
    }

    #server-url {
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
      cursor: pointer;
    }

    #server-url:focus { outline: 1px solid #3b82f6; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🤖</div>
    <div class="logo-text">
      <h1>TechCorp AI Chat</h1>
      <p>Phi-3.5 Financial Assistant</p>
    </div>
  </div>
  <div class="status" id="status-indicator">
    <div class="status-dot connecting" id="status-dot"></div>
    <span id="status-text">Connexion…</span>
    <input type="text" id="server-url" value="http://localhost:11434" title="URL du serveur Ollama" />
  </div>
</header>

<div class="chat-container" id="chat">
  <div class="welcome" id="welcome">
    <h2>💬 Assistant Financier TechCorp</h2>
    <p>Posez vos questions sur la finance, les investissements, les marchés et la gestion budgétaire.</p>
    <div class="suggestions">
      <button class="suggestion-btn" onclick="suggest(this)">Comment démarrer en bourse ?</button>
      <button class="suggestion-btn" onclick="suggest(this)">Expliquer les ETF</button>
      <button class="suggestion-btn" onclick="suggest(this)">Qu'est-ce que la diversification ?</button>
      <button class="suggestion-btn" onclick="suggest(this)">Comment lire un bilan comptable ?</button>
      <button class="suggestion-btn" onclick="suggest(this)">Risques du trading crypto</button>
    </div>
  </div>
</div>

<footer>
  <div class="input-row">
    <textarea
      id="input"
      placeholder="Posez votre question financière…"
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button id="send-btn" onclick="sendMessage()" title="Envoyer">➤</button>
  </div>
  <div class="model-info" id="model-info">Modèle: phi3-financial · Serveur: Ollama</div>
</footer>

<script>
  const MODEL = 'phi3-financial';
  const SYSTEM_PROMPT = `You are a financial assistant specialized in helping financial analysts at TechCorp Industries.
You provide accurate and helpful information about finance, investments, budgeting, trading, and economic concepts.
Always be concise, professional, and factually accurate.`;

  let history = [];
  let isStreaming = false;

  function getServerUrl() {
    return document.getElementById('server-url').value.replace(/\/$/, '');
  }

  async function checkConnection() {
    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    const indicator = document.getElementById('status-indicator');

    dot.className = 'status-dot connecting';
    text.textContent = 'Connexion…';
    indicator.className = 'status connecting';

    try {
      const res = await fetch(`${getServerUrl()}/api/tags`, { signal: AbortSignal.timeout(3000) });
      if (res.ok) {
        const data = await res.json();
        const models = data.models || [];
        const found = models.find(m => m.name.startsWith('phi3'));
        dot.className = 'status-dot connected';
        indicator.className = 'status connected';
        if (found) {
          text.textContent = `Connecté · ${found.name}`;
          document.getElementById('model-info').textContent = `Modèle: ${found.name} · Serveur: Ollama`;
        } else {
          text.textContent = 'Connecté (modèle absent)';
        }
      } else { throw new Error(); }
    } catch {
      dot.className = 'status-dot';
      indicator.className = 'status';
      text.textContent = 'Déconnecté';
    }
  }

  function suggest(btn) {
    document.getElementById('input').value = btn.textContent;
    sendMessage();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  }

  function addMessage(role, content = '') {
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '👤' : '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = content;

    div.appendChild(avatar);
    div.appendChild(bubble);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'message assistant';
    div.id = 'typing';

    div.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble">
        <div class="typing-indicator"><span></span><span></span><span></span></div>
      </div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function sendMessage() {
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const text = input.value.trim();
    if (!text || isStreaming) return;

    isStreaming = true;
    sendBtn.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    addMessage('user', text);
    history.push({ role: 'user', content: text });

    addTyping();

    const messages = [
      { role: 'system', content: SYSTEM_PROMPT },
      ...history
    ];

    try {
      const res = await fetch(`${getServerUrl()}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: MODEL, messages, stream: true })
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const typing = document.getElementById('typing');
      if (typing) typing.remove();

      const bubble = addMessage('assistant', '');
      let fullResponse = '';

      const reader = res.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value);
        const lines = chunk.split('\n').filter(l => l.trim());
        for (const line of lines) {
          try {
            const data = JSON.parse(line);
            if (data.message?.content) {
              fullResponse += data.message.content;
              bubble.textContent = fullResponse;
              document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
            }
          } catch { /* partial JSON */ }
        }
      }

      history.push({ role: 'assistant', content: fullResponse });

    } catch (err) {
      const typing = document.getElementById('typing');
      if (typing) typing.remove();
      const bubble = addMessage('assistant', '');
      bubble.style.color = '#f87171';
      bubble.textContent = `Erreur de connexion au serveur Ollama.\n\nVérifiez que :\n1. Ollama est démarré (ollama serve)\n2. Le modèle est chargé (ollama run phi3-financial)\n3. L'URL est correcte : ${getServerUrl()}\n\nErreur : ${err.message}`;
    }

    isStreaming = false;
    sendBtn.disabled = false;
    input.focus();
  }

  document.getElementById('server-url').addEventListener('change', checkConnection);

  checkConnection();
  setInterval(checkConnection, 15000);
</script>
</body>
</html>
